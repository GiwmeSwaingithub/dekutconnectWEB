<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="160" height="104" fill="currentColor">
  <!-- Royal Heraldic Crest for DEKUTCONNECT Post -->
  <g id="crest-wrapper" stroke="#111827" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Imperial Crown -->
    <path d="M85 30 L87 18 L94 25 L100 14 L106 25 L113 18 L115 30 Z" fill="#111827" />
    <circle cx="100" cy="11" r="2.5" fill="#111827" />
    <circle cx="87" cy="15" r="1.5" fill="#111827" />
    <circle cx="113" cy="15" r="1.5" fill="#111827" />
    <rect x="85" y="30" width="30" height="4" rx="1" fill="#111827" />
    <ellipse cx="100" cy="32" rx="14" ry="2" fill="#ffffff" />

    <!-- Central Heraldic Shield -->
    <path d="M85 36 H115 V65 C115 80 100 92 100 92 C100 92 85 80 85 65 Z" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <path d="M85 58 H115" stroke="#111827" stroke-width="1.8"/>
    <path d="M100 36 V90" stroke="#111827" stroke-width="1.8"/>
    
    <!-- Shield Emblems: Open Book (Wisdom) & Tech Gear (DeKUT Engineering) -->
    <!-- Quadrant 1: Book -->
    <path d="M89 44 C92 42 95 44 97 43 V53 C95 54 92 52 89 54 Z" fill="#111827" />
    <!-- Quadrant 2: Gear/Star -->
    <circle cx="107" cy="48" r="3" fill="#111827"/>
    <!-- Quadrant 3: Torch/Flame -->
    <path d="M92 78 C94 72 90 68 93 64 C96 68 95 72 92 78 Z" fill="#111827" />
    <!-- Quadrant 4: Key of knowledge -->
    <circle cx="107" cy="68" r="2.5" fill="none" stroke="#111827" stroke-width="1.2"/>
    <path d="M107 70.5 V78 M107 75 H110" stroke="#111827" stroke-width="1.2"/>

    <!-- Left Supporter: Rampant Lion -->
    <g id="left-lion" fill="#111827" stroke="#111827" stroke-width="0.8">
      <!-- Crown on lion -->
      <path d="M68 28 L69 22 L72 25 L75 20 L78 26 Z"/>
      <!-- Head and mane -->
      <path d="M72 27 C68 27 63 32 64 38 C60 38 56 42 57 47 C58 52 63 54 65 56 C62 60 60 66 61 72 C62 76 65 80 67 85 L72 85 C70 80 69 75 70 70 C72 70 76 68 78 64 C80 60 82 50 81 44 C81 38 78 30 72 27 Z"/>
      <!-- Forepaw reaching to shield -->
      <path d="M77 42 C80 40 84 42 85 45 L80 47 Z"/>
      <path d="M76 49 C80 48 83 50 85 54 L81 55 Z"/>
      <!-- Hind leg and claws -->
      <path d="M65 75 C60 78 58 84 57 90 L64 90 C65 86 67 82 70 80 Z"/>
      <!-- Tail -->
      <path d="M60 70 C53 66 50 56 52 50 C54 46 51 43 49 46 C47 54 50 68 57 76 Z" stroke-width="1.2"/>
      <circle cx="51" cy="46" r="2.5"/>
    </g>

    <!-- Right Supporter: Rampant Unicorn / Horse -->
    <g id="right-unicorn" fill="#111827" stroke="#111827" stroke-width="0.8">
      <!-- Horn / Crown -->
      <path d="M132 28 L131 22 L128 25 L125 20 L122 26 Z"/>
      <!-- Head and mane -->
      <path d="M128 27 C132 27 137 32 136 38 C140 38 144 42 143 47 C142 52 137 54 135 56 C138 60 140 66 139 72 C138 76 135 80 133 85 L128 85 C130 80 131 75 130 70 C128 70 124 68 122 64 C120 60 118 50 119 44 C119 38 122 30 128 27 Z"/>
      <!-- Foreleg reaching shield -->
      <path d="M123 42 C120 40 116 42 115 45 L120 47 Z"/>
      <path d="M124 49 C120 48 117 50 115 54 L119 55 Z"/>
      <!-- Hind leg -->
      <path d="M135 75 C140 78 142 84 143 90 L136 90 C135 86 133 82 130 80 Z"/>
      <!-- Tail -->
      <path d="M140 70 C147 66 150 56 148 50 C146 46 149 43 151 46 C153 54 150 68 143 76 Z" stroke-width="1.2"/>
      <circle cx="149" cy="46" r="2.5"/>
    </g>

    <!-- Heraldic Ribbon / Scroll Banner -->
    <path d="M42 98 C65 92 85 96 100 96 C115 96 135 92 158 98 L163 108 C145 103 125 106 100 106 C75 106 55 103 37 108 Z" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <!-- Folded ends of ribbon -->
    <path d="M37 108 L44 99 L42 114 Z" fill="#111827"/>
    <path d="M163 108 L156 99 L158 114 Z" fill="#111827"/>

    <!-- Motto Text on Banner -->
    <text x="100" y="103" font-family="'Times New Roman', serif" font-size="6.5" font-weight="bold" letter-spacing="1.2" text-anchor="middle" fill="#111827">DEKUTCONNECT • EST. 2024</text>
  </g>
</svg>
